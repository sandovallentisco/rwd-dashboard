name: Weekly RWD refresh and shinyapps.io deploy

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-rwd-dashboard-deploy
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      RWD_SOURCE_URL: https://gitlab.com/crossref/retraction-watch-data/-/raw/main/retraction_watch.csv
      SHINYAPPS_ACCOUNT: sandovallentisco
      SHINYAPPS_APP_NAME: rwd-dashboard

    steps:
      - name: Check out the dashboard
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.2.2"
          use-public-rspm: false

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 3
          packages: |
            any::shiny
            any::ggplot2
            any::dplyr
            any::stringr
            any::bslib
            any::maps
            any::plotly
            any::htmlwidgets
            any::rsconnect
            any::cpp11

      - name: Validate deployment dependencies
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))

          required_packages <- c(
            "shiny",
            "ggplot2",
            "dplyr",
            "stringr",
            "bslib",
            "maps",
            "plotly",
            "htmlwidgets",
            "rsconnect",
            "cpp11"
          )

          missing_packages <- required_packages[
            !vapply(required_packages, requireNamespace, logical(1), quietly = TRUE)
          ]
          if (length(missing_packages) > 0) {
            stop(
              "Packages required for deployment are missing: ",
              paste(missing_packages, collapse = ", ")
            )
          }

          deployment_dependencies <- rsconnect::appDependencies(appDir = ".")
          expected_app_packages <- setdiff(required_packages, "rsconnect")
          repository_sources <- unique(
            deployment_dependencies[c("Source", "Repository")]
          )
          print(repository_sources, row.names = FALSE)

          uses_rspm_alias <- grepl(
            "RSPM",
            paste(
              repository_sources$Source,
              repository_sources$Repository
            ),
            ignore.case = TRUE
          )
          if (any(uses_rspm_alias)) {
            stop(
              "The deployment manifest still contains the unsupported RSPM alias: ",
              paste(
                unique(repository_sources$Repository[uses_rspm_alias]),
                collapse = ", "
              )
            )
          }

          stopifnot(
            nrow(deployment_dependencies) > 0,
            all(expected_app_packages %in% deployment_dependencies$Package)
          )

      - name: Download the latest Retraction Watch data
        shell: Rscript {0}
        run: |
          source_url <- Sys.getenv("RWD_SOURCE_URL")
          temporary_file <- tempfile(fileext = ".csv")
          download.file(
            source_url,
            destfile = temporary_file,
            mode = "wb",
            quiet = TRUE,
            method = "libcurl"
          )

          if (!file.exists(temporary_file) || file.info(temporary_file)$size < 1e6) {
            stop("The downloaded Retraction Watch file is missing or unexpectedly small.")
          }

          if (!file.copy(temporary_file, "retraction_watch.csv", overwrite = TRUE)) {
            stop("Could not install the downloaded Retraction Watch file.")
          }

      - name: Rebuild and verify the processed cache
        shell: Rscript {0}
        run: |
          settings <- new.env(parent = baseenv())
          for (expression in parse(file = "app.R")) {
            is_assignment <-
              is.call(expression) &&
              identical(expression[[1]], as.name("<-"))
            assigned_name <- if (is_assignment) as.character(expression[[2]]) else ""

            if (assigned_name %in% c(
              "cache_version",
              "normalization_start_year",
              "refresh_interval_hours"
            )) {
              eval(expression, envir = settings)
            }
          }

          stopifnot(
            exists("cache_version", envir = settings, inherits = FALSE),
            exists("normalization_start_year", envir = settings, inherits = FALSE),
            exists("refresh_interval_hours", envir = settings, inherits = FALSE)
          )

          refresh_status <- system2(
            file.path(R.home("bin"), "Rscript"),
            args = c(
              "scripts/refresh_rwd_cache.R",
              normalizePath(".", winslash = "/", mustWork = TRUE),
              Sys.getenv("RWD_SOURCE_URL"),
              as.character(settings$cache_version),
              as.character(settings$normalization_start_year),
              format(Sys.Date(), "%Y"),
              paste(.libPaths(), collapse = .Platform$path.sep),
              as.character(settings$refresh_interval_hours)
            )
          )

          if (!identical(refresh_status, 0L)) {
            stop("The Retraction Watch cache rebuild failed.")
          }

          cache <- readRDS("retraction_watch_processed.rds")
          required_objects <- c(
            "retraction_data",
            "lag_paper_data",
            "lag_breakdown_data",
            "paper_reason_data",
            "country_data",
            "publisher_data",
            "reason_classification_data",
            "reason_classification_summary",
            "ieee_spike_summary",
            "ieee_spike_conferences"
          )

          stopifnot(
            identical(cache$cache_version, settings$cache_version),
            is.list(cache$data),
            all(required_objects %in% names(cache$data)),
            identical(
              unname(tools::md5sum("retraction_watch.csv")),
              cache$source_md5
            )
          )

      - name: Build and validate the deployment manifest
        shell: Rscript {0}
        run: |
          cran_url <- "https://cloud.r-project.org"
          options(repos = c(CRAN = cran_url))

          rsconnect::writeManifest(
            appDir = ".",
            dependencyResolution = "library",
            quiet = FALSE
          )

          manifest <- jsonlite::read_json(
            "manifest.json",
            simplifyVector = FALSE
          )
          if (is.null(manifest$packages) || length(manifest$packages) == 0) {
            stop("The generated manifest does not contain any R packages.")
          }

          repaired_packages <- character()
          for (package_name in names(manifest$packages)) {
            package <- manifest$packages[[package_name]]
            repository <- package$Repository

            if (
              !is.null(repository) &&
              identical(toupper(repository), "CRAN")
            ) {
              manifest$packages[[package_name]]$Repository <- cran_url
              repaired_packages <- c(repaired_packages, package_name)
            }
          }

          if (length(repaired_packages) > 0) {
            message(
              "Expanded the CRAN repository alias for ",
              length(repaired_packages),
              " package(s): ",
              paste(repaired_packages, collapse = ", ")
            )
          }

          jsonlite::write_json(
            manifest,
            "manifest.json",
            auto_unbox = TRUE,
            pretty = TRUE,
            null = "null"
          )

          manifest_check <- jsonlite::read_json(
            "manifest.json",
            simplifyVector = FALSE
          )
          package_repositories <- vapply(
            manifest_check$packages,
            function(package) {
              if (is.null(package$Repository)) "" else package$Repository
            },
            character(1)
          )
          unsupported_repositories <-
            nzchar(package_repositories) &
            !grepl("^https?://", package_repositories, ignore.case = TRUE)

          if (any(unsupported_repositories)) {
            stop(
              "The deployment manifest contains unsupported repository values: ",
              paste(
                unique(package_repositories[unsupported_repositories]),
                collapse = ", "
              )
            )
          }

          if (
            is.null(manifest_check$packages$maps) ||
            !identical(manifest_check$packages$maps$Repository, cran_url)
          ) {
            stop("The maps package does not have a deployable CRAN repository URL.")
          }

      - name: Deploy to shinyapps.io
        shell: Rscript {0}
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))

          required_secrets <- c("SHINYAPPS_TOKEN", "SHINYAPPS_SECRET")
          missing_secrets <- required_secrets[!nzchar(Sys.getenv(required_secrets))]
          if (length(missing_secrets) > 0) {
            stop(
              "Missing required GitHub Actions secrets: ",
              paste(missing_secrets, collapse = ", ")
            )
          }

          rsconnect::setAccountInfo(
            name = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )

          maximum_attempts <- 3L
          retry_delays_seconds <- c(60, 180)
          deployment_succeeded <- FALSE

          for (attempt in seq_len(maximum_attempts)) {
            message(
              "Starting shinyapps.io deployment attempt ",
              attempt,
              " of ",
              maximum_attempts,
              "."
            )

            deployment_error <- NULL
            deployment_succeeded <- tryCatch(
              {
                rsconnect::deployApp(
                  appDir = ".",
                  manifestPath = "manifest.json",
                  appName = Sys.getenv("SHINYAPPS_APP_NAME"),
                  account = Sys.getenv("SHINYAPPS_ACCOUNT"),
                  server = "shinyapps.io",
                  upload = TRUE,
                  forceUpdate = TRUE,
                  launch.browser = FALSE,
                  logLevel = "normal"
                )
                TRUE
              },
              error = function(error) {
                deployment_error <<- error
                FALSE
              }
            )

            if (deployment_succeeded) break

            error_message <- conditionMessage(deployment_error)
            retryable_service_error <- grepl(
              "HTTP[[:space:]]+503|Service Unavailable",
              error_message,
              ignore.case = TRUE
            )

            if (!retryable_service_error || identical(attempt, maximum_attempts)) {
              stop(deployment_error)
            }

            delay_seconds <- retry_delays_seconds[[attempt]]
            message(
              "shinyapps.io returned a temporary HTTP 503. Re-uploading the current dashboard bundle in ",
              delay_seconds,
              " seconds."
            )
            Sys.sleep(delay_seconds)
          }

          if (!deployment_succeeded) {
            stop("The shinyapps.io deployment did not complete successfully.")
          }
